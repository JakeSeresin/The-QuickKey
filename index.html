<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5, user-scalable=yes">
  <meta name="theme-color" content="#0f0f0f" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f5f4f0" media="(prefers-color-scheme: light)">
  <meta name="description" content="QuickKey – 100 essential keyboard shortcuts for Windows, VS Code, Chrome, Excel, Photoshop, and Word">
  <meta name="application-name" content="QuickKey">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="QuickKey">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230f0f0f'/><text x='50%25' y='55%25' dominant-baseline='middle' text-anchor='middle' font-size='60' fill='%23ffffff'>⌨</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <title>QuickKey – 100 Essential Shortcuts</title>
</head>
<body>
<div class="app-container">

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo-mark">⌨</div>
      <div class="brand">
        <span class="brand-name">QuickKey</span>
        <span class="brand-sub">Shortcuts</span>
      </div>
    </div>

    <div class="sidebar-section-label">APPS</div>
    <nav class="categories" id="categoryList" role="navigation" aria-label="Filter shortcuts by app"></nav>

    <div class="sidebar-footer">
      <div class="shortcut-count-pill" id="shortcutCountPill">
        <span id="visibleCount">100</span> shortcuts
      </div>
      <div class="footer-hint">Press <kbd class="hint-kbd">/</kbd> to search</div>
    </div>
  </aside>

  <!-- Main -->
  <main class="main-content" role="main">

    <!-- Top bar -->
    <header class="topbar">
      <div class="search-wrapper">
        <span class="search-icon" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="6.5" cy="6.5" r="5" stroke="currentColor" stroke-width="1.5"/><path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </span>
        <input type="text" class="search-input" id="searchInput"
          placeholder="Search shortcuts…"
          autocomplete="off" spellcheck="false" aria-label="Search shortcuts">
        <button class="clear-search" id="clearSearch" aria-label="Clear search">
          <svg width="12" height="12" viewBox="0 0 12 12"><path d="M1 1l10 10M11 1L1 11" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="view-toggle" role="group" aria-label="View mode">
        <button class="view-btn active" id="viewGrid" aria-pressed="true" title="Grid view">
          <svg width="14" height="14" viewBox="0 0 14 14"><rect x="0" y="0" width="6" height="6" rx="1.5" fill="currentColor"/><rect x="8" y="0" width="6" height="6" rx="1.5" fill="currentColor"/><rect x="0" y="8" width="6" height="6" rx="1.5" fill="currentColor"/><rect x="8" y="8" width="6" height="6" rx="1.5" fill="currentColor"/></svg>
        </button>
        <button class="view-btn" id="viewList" aria-pressed="false" title="List view">
          <svg width="14" height="14" viewBox="0 0 14 14"><rect x="0" y="1" width="14" height="2.5" rx="1.25" fill="currentColor"/><rect x="0" y="5.75" width="14" height="2.5" rx="1.25" fill="currentColor"/><rect x="0" y="10.5" width="14" height="2.5" rx="1.25" fill="currentColor"/></svg>
        </button>
      </div>
    </header>

    <!-- Shortcut Grid -->
    <div class="shortcut-grid" id="shortcutGrid" role="list" aria-label="Shortcut cards"></div>

  </main>
</div>

<!-- Copy toast notification -->
<div class="toast" id="copyToast" role="status" aria-live="polite">
  <svg width="14" height="14" viewBox="0 0 14 14"><path d="M2 7l4 4 6-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
  Copied!
</div>

<script src="app.js" defer></script>
</body>
</html>
